<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chibli Character Viewer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Codystar:wght@300;400&family=Comic+Relief:wght@400;700&family=Martel+Sans:wght@200;300;400;600;700;800;900&family=Pixelify+Sans&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="container">
        <div class="image-container">
          <img src="" alt="Character img" />
        </div>

        <h2 class="character-name"></h2>
        <p class="character-village"></p>
        <p class="character-jutsu"></p>
      </div>

      <div class="button-container">
        <button class="next-button">Next</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
